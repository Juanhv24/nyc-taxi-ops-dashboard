[project]
name = "nyc-taxi-ops"
version = "0.1.0"
description = "Tablero de operación e integridad tarifaria para los taxis amarillos de Nueva York (enero 2017)"
readme = "README.md"
authors = [
    { name = "JuanHV24" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
]

[project.scripts]
nyc-taxi-ops = "nyc_taxi_ops.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
